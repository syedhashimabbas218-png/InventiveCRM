name: platform-twenty upstream watch

# Nothing upgrades on its own. This only reports when Twenty ships a release and whether our branding still fits it.
on:
  schedule:
    - cron: "37 7 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/platform-twenty-upstream-watch.yml
      - platform-twenty/branding/**

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platform-twenty
    steps:
      - uses: actions/checkout@v4

      - name: Find the newest upstream release
        id: tags
        run: |
          pinned=$(jq -r .upstreamTag branding/brand.config.json)
          latest=$(git ls-remote --tags --refs https://github.com/twentyhq/twenty 'refs/tags/twenty/v*' | sed 's#.*refs/tags/##' | grep -E '^twenty/v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "::error::Could not read Twenty's release tags."
            exit 1
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$pinned" ] && [ "$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)" = "$latest" ]; then
            echo "newer=true" >> "$GITHUB_OUTPUT"
          else
            echo "Up to date: we run $pinned and Twenty's newest release is $latest." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.tags.outputs.newer == 'true'
        with:
          repository: twentyhq/twenty
          ref: refs/tags/${{ steps.tags.outputs.latest }}
          path: platform-twenty/upstream
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.tags.outputs.newer == 'true'
        with:
          node-version: 22

      - name: Check that our branding still fits
        id: check
        if: steps.tags.outputs.newer == 'true'
        run: |
          verdict="Ready to build: our branding and patches fit this release and the leak scan is clean."
          if ! node branding/apply.mjs --upstream ./upstream --config branding/brand.config.json > dry-run.txt 2>&1; then
            verdict="Not ready to build: some branding targets or patches no longer match this release."
          else
            # The dry run cannot tell what the rebranded pages still show, so rebrand this throwaway checkout and scan it.
            node branding/apply.mjs --upstream ./upstream --config branding/brand.config.json --write --version watch > /dev/null
            if ! node branding/leak-scan.mjs --upstream ./upstream --config branding/brand.config.json > leak-scan.txt 2>&1; then
              verdict="Not ready to build: after rebranding, some pages would still show Twenty's name, links or logo."
            fi
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Report
        if: steps.tags.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ steps.tags.outputs.latest }}
          PINNED: ${{ steps.tags.outputs.pinned }}
          VERDICT: ${{ steps.check.outputs.verdict }}
        run: |
          title="Twenty ${LATEST#twenty/v} is available (we run ${PINNED#twenty/v})"
          {
            echo "$VERDICT"
            echo
            echo "Nothing has been upgraded. Follow platform-twenty/UPDATES.md: build, rehearse on a copy of production, then upgrade production."
            echo
            echo "Release notes: https://github.com/twentyhq/twenty/releases/tag/$LATEST"
            for output in dry-run.txt leak-scan.txt; do
              [ -s "$output" ] || continue
              printf '\n<details><summary>%s</summary>\n\n````\n' "$output"
              tail -c 25000 "$output"
              printf '\n````\n\n</details>\n'
            done
          } > body.md
          { echo "## $title"; echo; cat body.md; } >> "$GITHUB_STEP_SUMMARY"

          if [ "$(gh api "repos/$GH_REPO" --jq .has_issues)" != "true" ]; then
            echo "::error title=$title::$VERDICT Issues are switched off for this repository, so this failed run is the notice. Turn them on under Settings > General > Features to get an issue instead."
            exit 1
          fi
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
