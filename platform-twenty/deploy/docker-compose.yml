name: inventivecrm

# Docker keeps container logs for ever by default; this caps each container at 100 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app: &app
  image: ${IMAGE}
  env_file: .env
  environment: &app-env
    PG_DATABASE_URL: postgres://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@db:5432/${PG_DATABASE_NAME}
    REDIS_URL: redis://redis:6379
    REDIS_QUEUE_URL: redis://redis-queue:6379
  volumes:
    - server-local-data:/app/packages/twenty-server/.local-storage
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    redis-queue:
      condition: service_healthy
    mail:
      condition: service_healthy
  networks: [default, mail, docs, realtime]
  logging: *logging
  restart: always

services:
  server:
    <<: *app
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 3g
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
      # Migrations run before the server listens; a big upgrade can take many minutes.
      start_period: 20m

  worker:
    <<: *app
    command: ["yarn", "worker:prod"]
    mem_limit: 2g
    environment:
      <<: *app-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      server:
        condition: service_healthy

  db:
    image: postgres:16.15@sha256:933463a6c8eba2b9f5cd414138738cd8d5519cd2c471214c222652f547a66a32
    environment:
      POSTGRES_USER: ${PG_DATABASE_USER}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    mem_limit: 2g
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    restart: always

  redis:
    image: redis:7.4.12@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    # Cache and login sessions. Kept on disk so a restart does not sign everyone out; when full, only keys that expire
    # anyway are evicted, least recently used first.
    command: ["--maxmemory", "768mb", "--maxmemory-policy", "volatile-lru", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    mem_limit: 1g
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    restart: always

  # Background job queues, separate so cache pressure can never evict a job. Never evicts; kept on disk.
  redis-queue:
    image: redis:7.4.12@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    command: ["--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-queue-data:/data
    mem_limit: 512m
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    restart: always

  # Live change notices for the app screens (../realtime/README.md). Opt in with COMPOSE_PROFILES=realtime and a
  # REALTIME_SECRET in .env. It holds no data; browsers connect through Caddy.
  realtime:
    profiles: [realtime]
    image: node:26.12.1-alpine3.23@sha256:bc2b334006f15c7167bbeb2f08f28c2df883f7594a0470e04454ebe7560cfe68
    command: ["node", "/srv/realtime/server.mjs"]
    environment:
      REALTIME_SECRET: ${REALTIME_SECRET:-}
    volumes:
      - ../realtime/server.mjs:/srv/realtime/server.mjs:ro
    ports:
      - "127.0.0.1:3200:3200"
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    networks: [realtime]
    healthcheck:
      test: wget -qO- http://127.0.0.1:3200/healthz
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging
    restart: always

  # Our outgoing mail server: system emails and invoices sent "from our server". Not published outside the stack.
  mail:
    image: boky/postfix:v5.1.0-alpine@sha256:6e761312e833947f77af755072c0e77b67d298d127595470a79e9454008dd594
    environment:
      ALLOWED_SENDER_DOMAINS: ${MAIL_SENDER_DOMAINS}
      POSTFIX_myhostname: ${MAIL_HOSTNAME}
      DKIM_AUTOGENERATE: "true"
      RELAYHOST: ${MAIL_RELAYHOST:-}
      RELAYHOST_USERNAME: ${MAIL_RELAYHOST_USERNAME:-}
      RELAYHOST_PASSWORD: ${MAIL_RELAYHOST_PASSWORD:-}
      RELAYHOST_TLS_LEVEL: ${MAIL_RELAYHOST_TLS_LEVEL:-may}
    volumes:
      - mail-dkim:/etc/opendkim/keys
      - mail-spool:/var/spool/postfix
    mem_limit: 256m
    networks: [mail]
    logging: *logging
    restart: always

  # Turns filled Word templates into PDFs (LibreOffice). No AI, no outside calls; reachable only inside the stack.
  docs:
    image: gotenberg/gotenberg:8.38.1-libreoffice@sha256:2098722190575dbd975d8abf02e4ce83ffe20783114c5cc56f1b2ac309e6a083
    command: ["gotenberg", "--api-timeout=60s", "--libreoffice-restart-after=50", "--log-level=warn"]
    mem_limit: 1536m
    # Converts client-supplied Word files, so it has no internet and cannot reach the database or Redis.
    networks: [docs]
    logging: *logging
    restart: always

  # Road routing and address search for the Scheduling app. Opt in with --profile maps after preparing MAPS_DIR
  # (apps/scheduling/README.md, "Maps"). Both stay inside the stack.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0@sha256:729461bcc9ae9e6aafa92c0f93db9b060a32e85d5e72092c01ae4a4a9f1eb564
    profiles: ["maps"]
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "500", "/data/region.osrm"]
    volumes:
      - ${MAPS_DIR:-./maps}:/data:ro
    logging: *logging
    restart: always

  geocoder:
    image: mediagis/nominatim:4.5@sha256:e25b434212b46fadb378fab8054fb3e96bdd69e8d174b0274e5f20e53f15e9f1
    profiles: ["maps"]
    environment:
      PBF_PATH: /data/region.osm.pbf
      IMPORT_STYLE: address
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD}
      THREADS: 4
    volumes:
      - ${MAPS_DIR:-./maps}/region.osm.pbf:/data/region.osm.pbf:ro
      - geocoder-data:/var/lib/postgresql/16/main
    shm_size: 1g
    logging: *logging
    restart: always

networks:
  default:
  mail:
  docs:
    internal: true
  # Not internal: Caddy on the host reaches the service through its published port.
  realtime:

volumes:
  db-data:
  redis-data:
  redis-queue-data:
  server-local-data:
  mail-dkim:
  mail-spool:
  geocoder-data:
