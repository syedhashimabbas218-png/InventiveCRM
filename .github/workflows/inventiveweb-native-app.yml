name: Native InventiveWeb app
on:
  pull_request:
    paths: ["inventiveweb/**", ".github/workflows/inventiveweb-native-app.yml"]
  push:
    branches: [main]
    paths: ["inventiveweb/**", ".github/workflows/inventiveweb-native-app.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventiveweb/apps/inventiveweb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: inventiveweb/apps/inventiveweb/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run pack:app
      - run: npm run verify:manifest
      - uses: actions/upload-artifact@v4
        with:
          name: inventiveweb-native-app
          path: inventiveweb/apps/inventiveweb/.twenty/output/**
          include-hidden-files: true
          if-no-files-found: error
