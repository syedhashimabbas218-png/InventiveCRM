name: Build branded Twenty image
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Public HTTPS workspace origin (no path)
        required: true
      support_url:
        description: InventiveWeb support URL
        required: true
      terms_url:
        description: InventiveWeb terms URL
        required: true
      privacy_url:
        description: InventiveWeb privacy URL
        required: true
      dpa_url:
        description: InventiveWeb DPA URL
        required: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-twenty" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: inventiveweb
          file: inventiveweb/infrastructure/coolify/twenty.Dockerfile
          target: twenty
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:2.43.0-iw-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=2.43.0
            PUBLIC_APP_URL=${{ inputs.app_url }}
            INVENTIVEWEB_WEBSITE_URL=https://inventiveweb.studio
            INVENTIVEWEB_SUPPORT_URL=${{ inputs.support_url }}
            INVENTIVEWEB_TERMS_URL=${{ inputs.terms_url }}
            INVENTIVEWEB_PRIVACY_URL=${{ inputs.privacy_url }}
            INVENTIVEWEB_DPA_URL=${{ inputs.dpa_url }}
      - name: Deployment reference
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "INVENTIVEWEB_IMAGE=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
