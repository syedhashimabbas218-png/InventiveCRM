map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 25m;

    # Staging safeguard. Native MCP is unavailable until the InventiveWeb
    # superadmin-only configuration and authorization flow is implemented.
    # Do not remove this to simulate completed MCP support.
    location ~* (^|/)mcp(/|$) {
        default_type application/json;
        return 403 '{"error":"MCP is not enabled on this deployment"}';
    }

    location / {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
