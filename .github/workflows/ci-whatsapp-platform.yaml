name: CI WhatsApp platform

on:
  pull_request:
    paths:
      - services/whatsapp-platform/**
      - .github/workflows/ci-whatsapp-platform.yaml
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  whatsapp-platform-test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wa_owner
          POSTGRES_PASSWORD: wa_owner
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wa_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/whatsapp-platform
    env:
      TEST_DATABASE_ADMIN_URL: postgres://wa_owner:wa_owner@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (includes cross-tenant isolation)
        run: npm test
